# Render blueprint. In the Render dashboard: New > Blueprint > pick this repo.
# LLM_API_KEY is marked sync:false so it is entered in the dashboard and never
# committed here.
services:
  - type: web
    name: disco-ad-placement-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-flash-latest
      - key: LLM_EMBED_MODEL
        value: gemini-embedding-001
      # Public URL on a shared key: cap per-IP usage so a stray script can't
      # drain the quota mid-review. Set to 0 to disable.
      - key: RATE_LIMIT_REQUESTS
        value: "20"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "3600"
